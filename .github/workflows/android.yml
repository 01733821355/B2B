name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      KEYSTORE_PATH: my-upload-key.jks
      STORE_PASSWORD: android
      KEY_PASSWORD: android

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Prepare Android SDK, Licenses & Environment
        run: |
          echo "Setting up Android SDK environment and licenses..."
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "sdk.dir=$SDK_ROOT" > local.properties

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH

          # Create .env for Secrets Gradle Plugin if missing
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Pre-seed ALL accepted license hashes so automated SDK download never fails
          mkdir -p "$SDK_ROOT/licenses"
          cat << 'EOF' > "$SDK_ROOT/licenses/android-sdk-license"
8933bad161af4178b1185d1a37fbf41ea5269c55
d56f5187479451eabf01fb78af6dfcb131a6481e
24333f8a63b6825ea9c5514f83c2829b004d1fee
c084f74853edd93da6433e3d173829a86a38a3a1
EOF

          cat << 'EOF' > "$SDK_ROOT/licenses/android-sdk-preview-license"
84831b9409646a247e3073db48957827972fce6e
7c4912242136e0d9b4b00518728d77d7301c27e8
EOF

          cat << 'EOF' > "$SDK_ROOT/licenses/android-googletv-license"
601085b94cd77f0b54ff86406957099fed807210
01a472d4a34edd2395561a196147d34be2403fb4
7983a8f172eb0005f9b8b2338b73f422e9752355
EOF

          cat << 'EOF' > "$SDK_ROOT/licenses/android-sdk-arm-dbt-license"
859f317696f67ef3d7f30a50a5560e7834b433fb
EOF

          cat << 'EOF' > "$SDK_ROOT/licenses/mips-android-sdk-license"
e9acab5b5fbb560a72cfa4f27c30f4d10488f53b
EOF

          # Find sdkmanager
          SDKMANAGER=""
          for candidate in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/cmdline-tools/bin/sdkmanager" "$SDK_ROOT/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(which sdkmanager 2>/dev/null || true)
          fi

          if [ -n "$SDKMANAGER" ]; then
            echo "Using sdkmanager at: $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" || \
            "$SDKMANAGER" --channel=3 "platforms;android-36" "build-tools;36.0.0" || \
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" || true
          fi

          # Ensure Gradle auto-download of SDK is enabled
          grep -q "android.builder.sdkDownload" gradle.properties 2>/dev/null || echo "android.builder.sdkDownload=true" >> gradle.properties

          # Generate debug.keystore if missing for signingConfigs.debugConfig
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -storetype PKCS12
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore || true
          cp debug.keystore app/debug.keystore || true

          # Generate my-upload-key.jks if missing (prevents failure when release signingConfig evaluates)
          if [ ! -f "my-upload-key.jks" ]; then
            echo "Generating my-upload-key.jks..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass android \
              -alias upload \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Upload Key,O=Android,C=US" \
              -storetype PKCS12
          fi
          cp my-upload-key.jks app/my-upload-key.jks || true

          # Ensure gradlew executable bit
          chmod +x gradlew || true

      - name: Build Android APK
        run: |
          echo "Building Android APK with Gradle..."
          export KEYSTORE_PATH="$(pwd)/my-upload-key.jks"
          export STORE_PASSWORD="android"
          export KEY_PASSWORD="android"

          if command -v gradle >/dev/null 2>&1; then
            gradle :app:assembleDebug --stacktrace --no-daemon
          else
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Verify APK Output
        run: |
          echo "Verifying generated APK:"
          ls -lh app/build/outputs/apk/debug/ || find app/build -name "*.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-CI-Debug-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/*/*.apk
          if-no-files-found: warn
          retention-days: 30
