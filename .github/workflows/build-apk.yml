name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Make Gradle script executable if exists
        run: |
          if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi

      - name: Build Debug APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Verify APK Generated
        run: |
          echo "Listing generated APK files:"
          find app/build/outputs/apk -type f -name "*.apk" || ls -la app/build/outputs/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RM-File-Management-Suite-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release (on main or version tag)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          tag_name: v1.0.${{ github.run_number }}
          name: "Release v1.0.${{ github.run_number }} (Direct APK Download)"
          body: |
            ## Automated Android APK Build
            
            This APK was automatically built via GitHub Actions CI/CD pipeline.
            
            ### Download & Install Instructions:
            1. Download the `app-debug.apk` file directly to your Android device.
            2. Tap on the downloaded APK to install.
            3. If prompted, enable "Install unknown apps" for your browser or file manager.
            4. Open **RM File Management Suite** and sign in.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
