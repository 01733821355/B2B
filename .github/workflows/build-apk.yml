name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Android SDK & Environment
        run: |
          echo "Setting up Android SDK environment and licenses..."
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK_ROOT" > local.properties

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH

          # Create .env for Secrets Gradle Plugin if missing
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Accept licenses and install platform packages
          SDKMANAGER=""
          for candidate in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/cmdline-tools/bin/sdkmanager" "$SDK_ROOT/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(which sdkmanager 2>/dev/null || true)
          fi

          if [ -n "$SDKMANAGER" ]; then
            echo "Using sdkmanager at: $SDKMANAGER"
            mkdir -p "$SDK_ROOT/licenses" || true
            yes | "$SDKMANAGER" --licenses || true
            "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" || true
          fi

          # Generate debug.keystore if missing for signingConfigs.debugConfig
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Ensure gradlew executable bit
          chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          echo "Building Debug APK with Gradle..."
          if command -v gradle >/dev/null 2>&1; then
            gradle :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"
          else
            ./gradlew :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"
          fi

      - name: Verify APK Output
        run: |
          echo "Verifying generated APK:"
          ls -lh app/build/outputs/apk/debug/ || find app/build -name "*.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RM-File-Management-Suite-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          tag_name: v1.0.${{ github.run_number }}
          name: "RM File Management Suite v1.0.${{ github.run_number }}"
          body: |
            ### Direct Android APK Download
            - **File:** `app-debug.apk`
            - **Target:** Android 7.0+ (Nougat through Android 16)
            - **Build ID:** Run #${{ github.run_number }}

            **How to install on phone:**
            1. Download `app-debug.apk` below directly on your Android phone.
            2. Tap the file to install (allow "Install Unknown Apps" if prompted).
            3. Open the app and log in with your assigned account (`104393`, `Admin0`, or `Mentor0`).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
