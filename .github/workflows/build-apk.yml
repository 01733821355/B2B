name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Environment & Android SDK Licenses
        run: |
          echo "Preparing build files, keystore, and Android SDK..."
          # Create .env if missing for Secrets Gradle Plugin
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Generate debug.keystore if missing for debug signing
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Accept Android licenses and install platform 36 if sdkmanager exists
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          if command -v sdkmanager >/dev/null 2>&1; then
            echo "Accepting Android SDK licenses..."
            yes | sdkmanager --licenses || true
            echo "Ensuring platform 36 is installed..."
            sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
          fi

      - name: Build Debug APK
        run: |
          echo "Running Gradle assembleDebug..."
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK Output
        run: |
          echo "Verifying generated APK:"
          ls -lh app/build/outputs/apk/debug/ || find app/build -name "*.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RM-File-Management-Suite-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          tag_name: v1.0.${{ github.run_number }}
          name: "RM File Management Suite v1.0.${{ github.run_number }}"
          body: |
            ### Direct Android APK Download
            - **File:** `app-debug.apk`
            - **Target:** Android 7.0+ (Nougat through Android 16)
            - **Build ID:** Run #${{ github.run_number }}

            **How to install on phone:**
            1. Download `app-debug.apk` below directly on your Android phone.
            2. Tap the file to install (allow "Install Unknown Apps" if prompted).
            3. Open the app and log in with your assigned account (`mentor0`, `admin0`, or `104393`).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
