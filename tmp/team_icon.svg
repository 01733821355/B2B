      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="108" height="108" rx="24" fill="url(#bgGrad)"/>
  <circle cx="54" cy="54" r="46" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.25"/>

